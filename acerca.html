<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acerca de nosotros — Trackear Vuelos</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    color: #16223A;
    line-height: 1.6;
  }
  h1 {
    color: #1D4ED8;
    font-size: 24px;
  }
  h2 {
    font-size: 17px;
    color: #1D4ED8;
    margin-top: 28px;
  }
  a.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #1D4ED8;
    text-decoration: none;
    font-size: 14px;
  }
  p {
    font-size: 15px;
  }
  #lang-switch-btn {
    float: right;
    background: #F4F8FF;
    border: 1px solid #D7E2F7;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    color: #1D4ED8;
    cursor: pointer;
  }
</style>
</head>
<body>

  <button type="button" id="lang-switch-btn">🌐 EN</button>
  <a class="back-link" href="index.html" data-i18n="back"></a>

  <h1 data-i18n="title"></h1>

  <p data-i18n="p1"></p>

  <h2 data-i18n="h2_how"></h2>
  <p data-i18n="p2"></p>

  <h2 data-i18n="h2_money"></h2>
  <p data-i18n="p3"></p>

  <h2 data-i18n="h2_who"></h2>
  <p data-i18n-html="p4"></p>

  <p style="margin-top: 32px; font-size: 13px; color: #888;">
    <a href="terminos.html" style="color:#888;" data-i18n="terms_link"></a>
  </p>

<script>
  const TRANSLATIONS = {
    es: {
      back: '← Volver al buscador',
      title: '✈️ Acerca de Trackear Vuelos',
      p1: 'Trackear Vuelos es un proyecto independiente creado para ayudarte a encontrar y monitorear precios de vuelos sin tener que estar revisando manualmente todos los días. Buscas tu ruta, guardas el precio que te interesa, y nosotros te avisamos automáticamente cuando baja.',
      h2_how: '¿Cómo funciona?',
      p2: 'Usamos datos de precios de vuelos de fuentes especializadas para mostrarte tarifas actuales y ayudarte a decidir cuándo comprar. Cuando guardas una ruta, revisamos el precio periódicamente y te notificamos por correo o notificación push si detectamos una baja.',
      h2_money: '¿Cómo ganamos dinero?',
      p3: 'Trackear Vuelos es gratis para ti. Cuando reservas un vuelo, seguro de viaje, u otro servicio a través de los enlaces que mostramos, podemos recibir una pequeña comisión del proveedor (por ejemplo, Aviasales, EKTA, AirHelp, y otros socios) — esto no cambia el precio que tú pagas.',
      h2_who: '¿Quién está detrás de esto?',
      p4: 'Somos un equipo pequeño enfocado en simplificar la búsqueda de vuelos baratos. Si tienes preguntas, sugerencias, o encuentras algún problema, puedes escribirnos a <a href="mailto:trackearvuelos@gmail.com">trackearvuelos@gmail.com</a>.',
      terms_link: 'Términos y condiciones',
    },
    en: {
      back: '← Back to search',
      title: '✈️ About Trackear Vuelos',
      p1: "Trackear Vuelos is an independent project built to help you find and monitor flight prices without checking manually every day. Search your route, save the price you're interested in, and we'll let you know automatically when it drops.",
      h2_how: 'How does it work?',
      p2: 'We use flight price data from specialized sources to show you current fares and help you decide when to buy. Once you save a route, we check the price periodically and notify you by email or push notification if we detect a drop.',
      h2_money: 'How do we make money?',
      p3: 'Trackear Vuelos is free for you. When you book a flight, travel insurance, or another service through the links we show, we may earn a small commission from the provider (e.g., Aviasales, EKTA, AirHelp, and other partners) — this does not change the price you pay.',
      h2_who: "Who's behind this?",
      p4: 'We are a small team focused on making cheap flight search simple. If you have questions, suggestions, or run into a problem, you can write to us at <a href="mailto:trackearvuelos@gmail.com">trackearvuelos@gmail.com</a>.',
      terms_link: 'Terms and Conditions',
    },
  };
  const currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = TRANSLATIONS[currentLang][el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = TRANSLATIONS[currentLang][el.dataset.i18nHtml]; });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🌐 EN' : '🌐 ES';
  }
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    localStorage.setItem('flightbot_lang', currentLang === 'es' ? 'en' : 'es');
    location.reload();
  });
  applyTranslations();
</script>

</body>
</html>
