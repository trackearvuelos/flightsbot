    --ink-faint: #6B7A94;
    --field-bg: #F4F8FF;
    --dash: #D7E2F7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #F1F6FF 0%, #FFFFFF 420px);
    color: var(--ink);
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }
  a.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--brand-blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 6px 0;
  }
  p.subtitle {
    margin: 0 0 22px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  #lang-switch-btn {
    float: right;
    background: var(--field-bg);
    border: 1px solid var(--dash);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-blue);
    cursor: pointer;
  }
  #products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }
  .product-card {
    background: #fff;
    border: 1px solid var(--dash);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .product-photo {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    background: linear-gradient(160deg, #E8F0FF 0%, #F7FAFF 100%);
  }
  .product-info {
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .product-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .product-desc {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    flex: 1;
  }
  .product-btn {
    display: block;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: var(--brand-wine);
    color: #FBF3EC;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
  }
  #disclosure {
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    padding: 8px 0 20px;
  }
</style>

      back: '← Back to search',
      title: '🧳 Trip essentials',
      subtitle: 'Products we recommend to make your next flight easier.',

      prod_firstaid_desc: 'Handle small scrapes and mishaps without hunting for a pharmacy abroad.',
      amazon_disclosure: 'As an Amazon Associate, we earn from qualifying purchases, at no extra cost to you.',

  let currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function t(key) { return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key; }
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🇺🇸 EN' : '🇪🇸 ES';
  }
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
  });
  applyTranslations();
