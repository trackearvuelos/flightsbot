<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Trackear Vuelos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1D4ED8">
<style>
  :root {
    color-scheme: light;
    --brand-blue: #1D4ED8;
    --brand-wine: #8C2F39;
    --ink: #16223A;
    --ink-soft: #5B6B85;
    --ink-faint: #6B7A94;
    --field-bg: #F4F8FF;
    --dash: #D7E2F7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #F1F6FF 0%, #FFFFFF 420px);
    color: var(--ink);
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  a.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--brand-blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 24px;
    margin: 0 0 6px 0;
  }
  p.subtitle {
    margin: 0 0 22px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  #lang-switch-btn {
    float: right;
    background: var(--field-bg);
    border: 1px solid var(--dash);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-blue);
    cursor: pointer;
  }
  .card {
    background: #fff;
    border: 1px solid var(--dash);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
  }
  #email-display {
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    background: var(--field-bg);
    border: 1px solid var(--dash);
    border-radius: 10px;
    padding: 14px;
    margin: 10px 0 14px;
    word-break: break-all;
    user-select: all;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--dash);
    background: var(--field-bg);
    color: var(--brand-blue);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  .btn-primary { background: var(--brand-blue); color: #fff; border-color: transparent; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
</style>
</head>
<body>

  <button type="button" id="lang-switch-btn">🌐 EN</button>
  <a class="back-link" href="index.html" data-i18n="back"></a>

  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <div class="card">
    <div data-i18n="email_label" style="font-size:12px; font-weight:700; color:var(--ink-faint);"></div>
    <span id="email-display">trackearvuelos@gmail.com</span>

    <a class="btn btn-primary" href="mailto:trackearvuelos@gmail.com" data-i18n="open_mail_btn"></a>
    <button type="button" class="btn" id="copy-email-btn" data-i18n="copy_btn"></button>
    <div class="hint" data-i18n="hint_text"></div>
  </div>

<script>
  const TRANSLATIONS = {
    es: {
      back: '← Volver al buscador',
      title: '✉️ Contacto',
      subtitle: 'Escríbenos si tienes dudas, sugerencias, o algo no te está funcionando.',
      email_label: 'Nuestro correo',
      open_mail_btn: '📧 Abrir en mi programa de correo',
      copy_btn: '📋 Copiar correo',
      copied: '✅ ¡Copiado!',
      hint_text: 'Si el botón de arriba no abre nada (pasa en algunas computadoras de trabajo), copia el correo y pégalo en Gmail, Outlook, o donde prefieras escribirnos.',
    },
    en: {
      back: '← Back to search',
      title: '✉️ Contact',
      subtitle: "Write to us if you have questions, suggestions, or something isn't working.",
      email_label: 'Our email',
      open_mail_btn: '📧 Open in my email app',
      copy_btn: '📋 Copy email',
      copied: '✅ Copied!',
      hint_text: "If the button above doesn't open anything (happens on some work computers), copy the email and paste it into Gmail, Outlook, or wherever you prefer to write to us.",
    },
  };

  let currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function t(key) { return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key; }
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🌐 EN' : '🌐 ES';
  }
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
  });
  applyTranslations();

  const copyBtn = document.getElementById('copy-email-btn');
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText('trackearvuelos@gmail.com');
      const original = copyBtn.textContent;
      copyBtn.textContent = t('copied');
      setTimeout(() => { copyBtn.textContent = original; }, 1800);
    } catch {
      // Si el navegador no permite copiar solo (poco común), al menos
      // ya el correo está seleccionable como texto arriba para copiar
      // a mano.
      const range = document.createRange();
      range.selectNode(document.getElementById('email-display'));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    }
  });
</script>

</body>
</html>
