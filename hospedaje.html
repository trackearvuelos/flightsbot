<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuentra hospedaje — Trackear Vuelos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1D4ED8">
<style>
  :root {
    color-scheme: light;
    --brand-blue: #1D4ED8;
    --ink: #16223A;
    --ink-soft: #5B6B85;
    --dash: #D7E2F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F1F6FF;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--dash);
    flex-shrink: 0;
  }
  a.back-link {
    color: var(--brand-blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }
  #lang-switch-btn {
    background: var(--field-bg, #F4F8FF);
    border: 1px solid var(--dash);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-blue);
    cursor: pointer;
  }
  #map-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #stay22-widget {
    flex: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

  <header>
    <a class="back-link" href="index.html" data-i18n="back"></a>
    <h1 data-i18n="title"></h1>
    <button type="button" id="lang-switch-btn">🌐 EN</button>
  </header>

  <div id="map-wrap">
    <iframe id="stay22-widget" src="https://www.stay22.com/embed/6a99c4b26c050ac995af1f27" frameborder="0"></iframe>
  </div>

<script>
  const TRANSLATIONS = {
    es: { back: '← Volver', title: '🏨 Encuentra dónde quedarte' },
    en: { back: '← Back', title: '🏨 Find a place to stay' },
  };
  let currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function t(key) { return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key; }
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🌐 EN' : '🌐 ES';
  }
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
  });
  applyTranslations();
</script>

</body>
</html>
