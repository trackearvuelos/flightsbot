<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuentra hospedaje — Trackear Vuelos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1D4ED8">
<style>
  :root {
    color-scheme: light;
    --brand-blue: #1D4ED8;
    --ink: #16223A;
    --ink-soft: #5B6B85;
    --dash: #D7E2F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F1F6FF;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--dash);
    flex-shrink: 0;
  }
  a.back-link {
    color: var(--brand-blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }
  #lang-switch-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--field-bg, #F4F8FF);
    border: 1px solid var(--dash);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-blue);
    cursor: pointer;
  }
  #map-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #stay22-widget {
    flex: 1;
    width: 100%;
    border: none;
  }
  #tickets-note {
    display: none;
    background: #FFF8E6;
    border-bottom: 1px solid #F0D98C;
    color: var(--ink);
    font-size: 16px;
    padding: 12px 16px;
    text-align: center;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <header>
    <a class="back-link" href="index.html" data-i18n="back"></a>
    <h1 id="page-title" data-i18n="title"></h1>
    <button type="button" id="lang-switch-btn"><svg width="16" height="11" viewBox="0 0 16 11"><rect width="16" height="11" fill="#B22234"/><rect y="1" width="16" height="1" fill="#fff"/><rect y="3" width="16" height="1" fill="#fff"/><rect y="5" width="16" height="1" fill="#fff"/><rect y="7" width="16" height="1" fill="#fff"/><rect y="9" width="16" height="1" fill="#fff"/><rect width="7" height="6" fill="#3C3B6E"/></svg>EN</button>
  </header>

  <div id="tickets-note" data-i18n="tickets_note"></div>

  <div id="map-wrap">
    <iframe id="stay22-widget" src="https://www.stay22.com/embed/6a99c4b26c050ac995af1f27" frameborder="0"></iframe>
  </div>

<script>
  const TRANSLATIONS = {
    es: {
      back: '← Volver',
      title: '🏨 Encuentra dónde quedarte',
      tickets_note: '🎟️ ¿Buscas tours o actividades? Toca el <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align:middle;"><line x1="4" y1="2" x2="4" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="1.5" y1="6" x2="6.5" y2="6" stroke="#16223A" stroke-width="2.2"/><line x1="9" y1="2" x2="9" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="6.5" y1="11" x2="11.5" y2="11" stroke="#16223A" stroke-width="2.2"/><line x1="14" y1="2" x2="14" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="11.5" y1="4" x2="16.5" y2="4" stroke="#16223A" stroke-width="2.2"/></svg> filtro arriba del mapa y elige "Experience".',
    },
    en: {
      back: '← Back',
      title: '🏨 Find a place to stay',
      tickets_note: '🎟️ Looking for tours or activities? Tap the <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align:middle;"><line x1="4" y1="2" x2="4" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="1.5" y1="6" x2="6.5" y2="6" stroke="#16223A" stroke-width="2.2"/><line x1="9" y1="2" x2="9" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="6.5" y1="11" x2="11.5" y2="11" stroke="#16223A" stroke-width="2.2"/><line x1="14" y1="2" x2="14" y2="16" stroke="#16223A" stroke-width="1.6"/><line x1="11.5" y1="4" x2="16.5" y2="4" stroke="#16223A" stroke-width="2.2"/></svg> filter above the map and choose "Experience".',
    },
  };
  let currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function t(key) { return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key; }

  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.getElementById('page-title').textContent = t('title');
    document.querySelector('a.back-link').textContent = t('back');
    document.getElementById('tickets-note').innerHTML = t('tickets_note');
    document.getElementById('lang-switch-btn').innerHTML = currentLang === 'es'
      ? '<svg width="16" height="11" viewBox="0 0 16 11"><rect width="16" height="11" fill="#B22234"/><rect y="1" width="16" height="1" fill="#fff"/><rect y="3" width="16" height="1" fill="#fff"/><rect y="5" width="16" height="1" fill="#fff"/><rect y="7" width="16" height="1" fill="#fff"/><rect y="9" width="16" height="1" fill="#fff"/><rect width="7" height="6" fill="#3C3B6E"/></svg>EN'
      : '<svg width="16" height="11" viewBox="0 0 16 11"><rect width="16" height="11" fill="#AA151B"/><rect y="2.75" width="16" height="5.5" fill="#F1BF00"/></svg>ES';
  }
  document.getElementById('tickets-note').style.display = 'block';
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
  });
  applyTranslations();
</script>

</body>
</html>
