  function t(key, params) {
    let str = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key;
    if (params) {
      for (const [k, v] of Object.entries(params)) {
        str = str.replace(`{${k}}`, v);
      }
    }
    return str;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => {
      el.innerHTML = t(el.dataset.i18nHtml);
    });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
      el.placeholder = t(el.dataset.i18nPh);
    });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🌐 EN' : '🌐 ES';
  }

  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
    // Si ya está verificado, avisamos al Worker del cambio para que los
    // correos/push automáticos futuros también respeten el idioma nuevo.
    const session = getValidSessionToken ? getValidSessionToken() : null;
    if (session) {
      const email = getUserEmail ? getUserEmail() : null;
      if (email) {
        fetch(`${CALENDAR_PROXY_URL}?action=set_language`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, session_token: session, language: currentLang }),
        }).catch(() => {});
      }
    }
  });

    // directo la sección de canales sin tener que verificar de nuevo.
    if (getValidSessionToken()) {
      document.getElementById('channels-box').style.display = 'block';
    }

    // Registramos el Service Worker (necesario para poder recibir
    // notificaciones push reales, incluso con la app cerrada).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.error('No se pudo registrar el Service Worker:', err);
      });
    }

    // El botón de "Activar notificaciones push" solo aparece cuando la
    // app ya está instalada (modo standalone) — no tiene sentido
    // ofrecerlo en una pestaña normal del navegador, ya que ahí ese tipo
    // de notificación es menos confiable/consistente entre navegadores.
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true; // Safari/iOS
    if (isStandalone) {
      const btn = document.getElementById('enable-push-btn');
      btn.style.display = 'block';

      // Si este dispositivo ya tiene una suscripción activa (de una
      // visita anterior), lo mostramos de inmediato como "activado" —
      // no hace falta pedir permiso de nuevo ni tocar nada.
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        navigator.serviceWorker.ready
          .then((registration) => registration.pushManager.getSubscription())
          .then((existingSub) => {
            if (existingSub) markPushAsActivated();
          })
          .catch(() => {});
      }
    }
  });

  function normalize(s) {
    return s.toLowerCase()
      .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i')
      .replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n');
  }

  function searchAirports(query) {
    const q = normalize(query.trim());
    if (!q) return [];
    return AIRPORTS.filter(([code, city, country]) =>
      normalize(`${code} ${city} ${country}`).includes(q)
    ).slice(0, 6);
  }

  function setupAutocomplete(inputId, suggestionsId) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(suggestionsId);
    let selectedCode = null;

    input.addEventListener('input', () => {
      selectedCode = null;
      const results = searchAirports(input.value);
      box.innerHTML = '';
      if (results.length === 0) {
        box.classList.remove('open');
        return;
      }
      results.forEach(([code, city, country]) => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.innerHTML = `<span class="suggestion-code">${code}</span>${city}, ${country}`;
        item.addEventListener('click', () => {
          input.value = `${city} (${code})`;
          input.dataset.code = code;
          box.classList.remove('open');
        });
        box.appendChild(item);
      });
      box.classList.add('open');
    });

    input.addEventListener('blur', () => {
      setTimeout(() => box.classList.remove('open'), 150);
    });

    input.addEventListener('focus', () => {
      if (input.value) input.dispatchEvent(new Event('input'));
    });
  }

    document.getElementById('return-date').disabled = oneWayCheckbox.checked;
  });

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
    // Nos aseguramos de que el usuario SIEMPRE vea el error, sin importar
    // en qué parte de la página esté el botón que lo generó — antes el
    // mensaje quedaba fijo al final de la página y podía pasar
    // desapercibido si el usuario estaba arriba.
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function getAirportCode(inputId) {
    const input = document.getElementById(inputId);
    if (input.dataset.code) return input.dataset.code;
    // Si el usuario escribió el código de 3 letras directo, sin usar el autocompletado
    const raw = input.value.trim().toUpperCase();
    if (/^[A-Z]{3}$/.test(raw)) return raw;
    return null;
  }

  // Solo email como canal de notificación (Telegram quitado para simplificar).
  const selectedChannel = 'email';
  const userEmailInput = document.getElementById('user-email');

  function getUserEmail() {
    const email = userEmailInput.value.trim();
    if (!email || !email.includes('@') || !email.split('@')[1]?.includes('.')) return null;
    return email;
  }

  // --- Sesión de verificación (código de un solo uso por correo) ---
  // Sin esto, cualquiera podría escribir el correo de otra persona y
  // ver/borrar sus rutas. El session_token solo lo consigue quien de
  // verdad recibió el código de 6 dígitos en su bandeja de entrada.
  const verificationBox = document.getElementById('verification-box');
  const verificationStatus = document.getElementById('verification-status');
  const requestCodeBtn = document.getElementById('request-code-btn');
  const codeEntryRow = document.getElementById('code-entry-row');
  const verifyCodeInput = document.getElementById('verify-code-input');
  const confirmCodeBtn = document.getElementById('confirm-code-btn');

  function getStoredSession() {
    try {
      const raw = localStorage.getItem('flightbot_session');
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function getValidSessionToken() {
    const email = getUserEmail();
    const stored = getStoredSession();
    if (email && stored && stored.email === email && stored.session_token) {
      return stored.session_token;
    }
    return null;
  }

  // Si al abrir la página ya hay un correo+sesión guardados de una
  // visita anterior, los precargamos para no pedir el código de nuevo.
  const savedSession = getStoredSession();
  if (savedSession?.email) {
    userEmailInput.value = savedSession.email;
  }

  // Manda el código de verificación al correo. Se llama automáticamente
  // en cuanto se necesita verificar (ya no hay que tocar un botón aparte
  // para pedirlo la primera vez).
  async function sendVerificationCode(email) {
    verificationStatus.textContent = currentLang === 'en' ? 'Sending code...' : 'Enviando código...';
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=request_verification`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, language: currentLang }),
      });
      const data = await resp.json();
      if (data.success) {
        verificationStatus.textContent = currentLang === 'en'
          ? 'We sent you a verification code (check spam too):'
          : 'Te enviamos un código de verificación (revisa spam también):';
        codeEntryRow.style.display = 'block';
        requestCodeBtn.style.display = 'inline-block';
      } else {
        verificationStatus.textContent = `⚠️ ${data.error || 'No se pudo mandar el código.'}`;
      }
    } catch (err) {
      verificationStatus.textContent = '⚠️ Error de conexión: ' + err.message;
    }
  }

  // Muestra el cuadro de verificación y manda el código automáticamente.
  // "retryFn" (opcional) es la acción que se vuelve a intentar sola en
  // cuanto el código se confirma con éxito — así no hay que tocar el
  // botón original una segunda vez.
  let pendingRetryFn = null;
  function promptVerification(message, retryFn) {
    const email = getUserEmail();
    if (!email) {
      showError('Escribe un correo válido arriba primero.');
      return;
    }
    pendingRetryFn = retryFn || null;
    verificationBox.style.display = 'block';
    codeEntryRow.style.display = 'none';
    requestCodeBtn.style.display = 'none';
    verificationBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    sendVerificationCode(email);
  }

  // El botón queda como "Reenviar código", por si el primero no llega.
  requestCodeBtn.textContent = '🔄 Reenviar código';
  requestCodeBtn.style.display = 'none';
  requestCodeBtn.addEventListener('click', async () => {
    const email = getUserEmail();
    if (!email) { showError('Escribe un correo válido arriba primero.'); return; }

    requestCodeBtn.disabled = true;
    requestCodeBtn.textContent = 'Reenviando...';
    await sendVerificationCode(email);
    requestCodeBtn.disabled = false;
    requestCodeBtn.textContent = '🔄 Reenviar código';
  });

  confirmCodeBtn.addEventListener('click', async () => {
    const email = getUserEmail();
    const code = verifyCodeInput.value.trim();
    if (!code) { verificationStatus.textContent = '⚠️ Escribe el código que te llegó.'; return; }

    confirmCodeBtn.disabled = true;
    confirmCodeBtn.textContent = 'Confirmando...';
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=confirm_email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code }),
      });
      const data = await resp.json();
      if (data.success) {
        localStorage.setItem('flightbot_session', JSON.stringify({ email, session_token: data.session_token }));
        verificationStatus.textContent = '✅ Correo verificado. Ya puedes ver/borrar tus rutas.';
        codeEntryRow.style.display = 'none';
        document.getElementById('channels-box').style.display = 'block';
        if (pendingRetryFn) {
          const retry = pendingRetryFn;
          pendingRetryFn = null;
          retry();
        }
      } else {
        verificationStatus.textContent = `⚠️ ${data.error || 'Código incorrecto.'}`;
      }
    } catch (err) {
      verificationStatus.textContent = '⚠️ Error de conexión: ' + err.message;
    } finally {
      confirmCodeBtn.disabled = false;
      confirmCodeBtn.textContent = '✅ Confirmar código';
    }
  });

  function validateAndBuildPayload() {
    clearError();
    const email = getUserEmail();
    const origin = getAirportCode('origin');
    const destination = getAirportCode('destination');
    const departDate = document.getElementById('depart-date').value;
    const returnDate = oneWayCheckbox.checked ? null : document.getElementById('return-date').value;
    const maxPrice = document.getElementById('max-price').value;
    const passengers = parseInt(document.getElementById('passengers').value, 10) || 1;

    if (!email) { showError(t('err_email')); return null; }
    if (!origin) { showError(t('err_origin_valid')); return null; }
    if (!destination) { showError(t('err_destination_valid')); return null; }
    if (origin === destination) { showError(t('err_same')); return null; }
    if (!departDate) { showError(t('err_depart_date')); return null; }
    if (!oneWayCheckbox.checked && !returnDate) { showError(t('err_return_date')); return null; }
    if (returnDate && returnDate < departDate) { showError(t('err_return_before')); return null; }
    if (passengers < 1 || passengers > 9) { showError(t('err_passengers_range')); return null; }

    return {
      email,
      origin,
      destination,
      depart_date: departDate,
      return_date: returnDate || null,
      max_price: maxPrice ? parseFloat(maxPrice) : null,
      passengers,
      notify_channel: selectedChannel,
      language: currentLang,
    };
  }

  // Botón "Buscar y elegir vuelo": primero consulta AMBAS opciones
  // (directo y con escala) sin guardar nada todavía — cada una tiene su
  // propio botón de "Seguir este", así puedes seguir una, la otra, o
  // las dos si quieres comparar cómo evolucionan.
  const searchFlightBtn = document.getElementById('search-flight-btn');
  const trackResultBox = document.getElementById('track-result-box');

  function paxLabelClient(n) {
    if (currentLang === 'en') return n === 1 ? '1 passenger' : `${n} passengers`;
    return n === 1 ? '1 pasajero' : `${n} pasajeros`;
  }

  function renderOfferPreviewRow(offer, payload) {
    const paxLabel = paxLabelClient(payload.passengers);
    const perPersonNote = payload.passengers > 1 && offer.price_per_person
      ? ` ($${offer.price_per_person.toFixed(0)} c/u)`
      : '';
    // Ya no mostramos "Directo"/"Con escala" — no es un dato confiable
    // (las paradas técnicas a veces se reportan como escala real, según
    // cada aerolínea). Nos quedamos solo con la aerolínea, que sí es
    // 100% confiable.
    // Nota honesta: Aviasales no nos deja armar un link que filtre por
    // una aerolínea específica — este "Reservar" te lleva a la búsqueda
    // general de esta ruta/fechas, donde puedes elegir esa aerolínea tú
    // mismo si aparece ahí también.
    const link = buildAffiliateLink(payload.origin, payload.destination, payload.depart_date, payload.return_date, payload.passengers);

    // Seguro de viaje: no tenemos acceso a la API de precios real de EKTA,
    // pero los seguros de viaje típicamente cuestan 5-8% del costo del
    // viaje — mostramos ese RANGO como estimado, dejando claro que hay
    // que cotizar el real. Nunca inventamos un número para el hotel
    // porque no tenemos ninguna base razonable para estimarlo.
    const insuranceLow = (offer.price * 0.05).toFixed(0);
    const insuranceHigh = (offer.price * 0.08).toFixed(0);

    const shareMessage = t('share_message', {
      origin: payload.origin, destination: payload.destination,
      airline: offer.airline, price: offer.price.toFixed(0),
      link: link || '',
    });
    const whatsappLink = `https://wa.me/?text=${encodeURIComponent(shareMessage)}`;

    return `
      <div class="price-row">
        <div class="price-row-header">
          <span>✈️ ${offer.airline} (${paxLabel})</span>
          <span class="price-tag">$${offer.price.toFixed(0)}${perPersonNote}</span>
        </div>
        <button type="button" class="calendar-btn track-this-btn" data-airline="${offer.airline}" style="margin:6px 0 0; background:var(--brand-blue); color:#fff; border-color:transparent;">
          ${t('follow_this')}
        </button>
        ${link ? `<a class="row-book-link" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('book_this', { airline: offer.airline })}</a>` : ''}
        <a href="${whatsappLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="row-book-link" style="color:#25D366;">${t('share_whatsapp')}</a>
        <div class="calendar-status" style="padding:6px 0 0; font-size:11px;">
          ${t('insurance_estimate', { low: insuranceLow, high: insuranceHigh })} ·
          <a href="${EKTA_INSURANCE_LINK}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand-blue);">${t('insurance_quote_link')}</a>
        </div>
        <div class="calendar-status" style="padding:2px 0 0;">
          <a href="https://kkday.tpk.lu/5urmUSJX" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand-blue); font-size:11px;">${t('hotel_note_link')}</a>
        </div>
      </div>`;
  }

  async function saveTrackedRoute(payload, preferredAirline, statusBox, btn) {
    statusBox.innerHTML = `<div class="calendar-status">${t('saving')}</div>`;
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=track`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, preferred_airline: preferredAirline }),
      });
      const data = await resp.json();
      if (!data.success) {
        statusBox.innerHTML = `<div class="calendar-status">⚠️ ${data.error || 'Error'}</div>`;
        if (btn) { btn.disabled = false; btn.textContent = t('follow_this'); }
        return;
      }

      const link = buildAffiliateLink(payload.origin, payload.destination, payload.depart_date, payload.return_date, payload.passengers);
      const linkHtml = link ? `<a class="book-link" href="${link}" target="_blank" rel="noopener">${t('search_btn').includes('Find') ? 'Book' : 'Reservar'}</a><a class="app-install-link" href="${EKTA_INSURANCE_LINK}" target="_blank" rel="noopener">🛡️ ${currentLang === 'en' ? 'Traveling? Get a quote here' : '¿Aseguras tu viaje? Cotiza aquí'}</a><a class="app-install-link" href="${AIRHELP_LINK}" target="_blank" rel="noopener">🧳 ${currentLang === 'en' ? 'Flight delayed/canceled? Claim here' : '¿Vuelo retrasado/cancelado? Reclama aquí'}</a><a class="app-install-link" href="${COMPENSAIR_LINK}" target="_blank" rel="noopener">🧳 ${currentLang === 'en' ? '(or here too)' : '(o también aquí)'}</a>` : '';
      const paxLabel = paxLabelClient(payload.passengers);
      const perPersonNote = data.offer && payload.passengers > 1 && data.offer.price_per_person
        ? `<div class="calendar-status" style="padding:0;">($${data.offer.price_per_person.toFixed(0)} ${t('per_person')} × ${payload.passengers})</div>`
        : '';
      const offerHtml = data.offer
        ? `<div class="price-row cheapest"><div class="price-row-header"><span>✈️ ${data.offer.airline} (${paxLabel})</span><span class="price-tag">${t('total_label')}: $${data.offer.price.toFixed(0)}</span></div>${perPersonNote}</div>${linkHtml}`
        : `<div class="calendar-status">${t('no_live_price')}</div>`;

      const notifHtml = data.notification_sent
        ? `<div class="calendar-status">${t('notif_sent')}</div>`
        : data.notification_error
        ? `<div class="calendar-status">${t('notif_error', { err: data.notification_error })}</div>`
        : '';

      statusBox.innerHTML = `
        <div class="price-calendar-title">${t('route_saved_title', { id: data.route_id, origin: payload.origin, destination: payload.destination })}</div>
        ${offerHtml}
        ${notifHtml}`;
      if (btn) { btn.textContent = t('following'); } // se queda deshabilitado, no re-habilitamos
    } catch (err) {
      statusBox.innerHTML = `<div class="calendar-status">⚠️ ${err.message}</div>`;
      if (btn) { btn.disabled = false; btn.textContent = t('follow_this'); }
    }
  }

  searchFlightBtn.addEventListener('click', async () => {
    const payload = validateAndBuildPayload();
    if (!payload) return;

    searchFlightBtn.disabled = true;
    searchFlightBtn.textContent = t('searching');
    trackResultBox.classList.add('open');
    trackResultBox.innerHTML = `<div class="calendar-status">${t('consulting_airlines')}</div>`;

    try {
      const params = new URLSearchParams({
        action: 'price', origin: payload.origin, destination: payload.destination,
        depart_date: payload.depart_date, adults: payload.passengers,
      });
      if (payload.return_date) params.set('return_date', payload.return_date);

      const resp = await fetch(`${CALENDAR_PROXY_URL}?${params.toString()}`);
      const data = await resp.json();

      if (!data.success) {
        trackResultBox.innerHTML = `<div class="calendar-status">⚠️ ${data.error || (currentLang === 'en' ? 'No flights found.' : 'No se encontraron vuelos.')}</div>`;
        return;
      }

      const offers = data.offers_all || [];
      const rowsHtml = offers.map((offer) => renderOfferPreviewRow(offer, payload)).join('');

      trackResultBox.innerHTML = `
        <div class="price-calendar-title">${t('choose_which', { n: offers.length })}</div>
        <div class="calendar-status" style="padding:0 4px 8px;">${t('live_data_note')}</div>
        ${rowsHtml}
        <div id="track-save-status"></div>`;

      trackResultBox.querySelectorAll('.track-this-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          btn.disabled = true;
          btn.textContent = t('saving');
          const statusBox = document.getElementById('track-save-status');
          saveTrackedRoute(payload, btn.dataset.airline, statusBox, btn);
        });
      });
    } catch (err) {
      trackResultBox.innerHTML = `<div class="calendar-status">⚠️ ${err.message}</div>`;
    } finally {
      searchFlightBtn.disabled = false;
      searchFlightBtn.textContent = t('search_btn');
    }
  });

  // --- Activar notificaciones push reales ---
  const enablePushBtn = document.getElementById('enable-push-btn');
  const pushStatus = document.getElementById('push-status');

  enablePushBtn.addEventListener('click', async () => {
    clearError();
    const email = getUserEmail();
    if (!email) { showError('Escribe un correo válido arriba primero.'); return; }
    const sessionToken = getValidSessionToken();
    if (!sessionToken) { promptVerification('Verifica tu correo antes de activar las notificaciones push.', () => enablePushBtn.click()); return; }

    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      pushStatus.textContent = '⚠️ Tu navegador no soporta notificaciones push.';
      return;
    }

    enablePushBtn.disabled = true;
    enablePushBtn.textContent = 'Activando...';
    let activated = false;
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        pushStatus.textContent = '⚠️ No diste permiso de notificaciones. Actívalo desde la configuración del navegador si cambias de opinión.';
        return;
      }

      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }

      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=save_push_subscription`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, session_token: sessionToken, subscription: subscription.toJSON() }),
      });
      const data = await resp.json();

      if (!data.success && data.needs_verification) {
        promptVerification('Tu sesión expiró. Verifica tu correo de nuevo.', () => enablePushBtn.click());
      } else if (!data.success) {
        pushStatus.textContent = `⚠️ ${data.error || 'No se pudo activar.'}`;
      } else if (data.test_sent) {
        pushStatus.textContent = '✅ Notificaciones push activadas. Te mandamos una de prueba.';
        activated = true;
      } else {
        // Se guardó la suscripción aunque la prueba haya fallado — igual
        // cuenta como "activado", ya no hace falta volver a tocar el botón.
        pushStatus.textContent = `⚠️ Se guardó, pero la prueba falló: ${data.test_error || ''}`;
        activated = true;
      }
    } catch (err) {
      pushStatus.textContent = '⚠️ Error activando notificaciones: ' + err.message;
    } finally {
      if (activated) {
        markPushAsActivated();
      } else {
        enablePushBtn.disabled = false;
        enablePushBtn.textContent = '🔔 Activar notificaciones push';
      }
    }
  });

  // --- Canales de notificación (varios a la vez) ---
  const channelWhatsappCheckbox = document.getElementById('channel-whatsapp');
  const whatsappNumberRow = document.getElementById('whatsapp-number-row');
  channelWhatsappCheckbox.addEventListener('change', () => {
    whatsappNumberRow.style.display = channelWhatsappCheckbox.checked ? 'block' : 'none';
  });

  const saveChannelsBtn = document.getElementById('save-channels-btn');
  const channelsStatus = document.getElementById('channels-status');
  saveChannelsBtn.addEventListener('click', async () => {
    const email = getUserEmail();
    if (!email) { showError(t('err_email')); return; }
    const sessionToken = getValidSessionToken();
    if (!sessionToken) { promptVerification(t('err_email'), () => saveChannelsBtn.click()); return; }

    const channels = [];
    if (document.getElementById('channel-email').checked) channels.push('email');
    if (document.getElementById('channel-push').checked) channels.push('push');
    if (channelWhatsappCheckbox.checked) channels.push('whatsapp');

    if (channels.length === 0) { channelsStatus.textContent = `⚠️ ${t('err_pick_channel')}`; return; }

    const whatsappNumber = document.getElementById('whatsapp-number-input').value.trim();
    if (channelWhatsappCheckbox.checked && !whatsappNumber) {
      channelsStatus.textContent = `⚠️ ${t('err_whatsapp_number')}`;
      return;
    }

    saveChannelsBtn.disabled = true;
    saveChannelsBtn.textContent = t('saving_channels');
    channelsStatus.textContent = '';
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=set_channels`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, session_token: sessionToken, channels, whatsapp_number: whatsappNumber || null }),
      });
      const data = await resp.json();
      if (!data.success && data.needs_verification) {
        promptVerification(t('err_email'), () => saveChannelsBtn.click());
      } else if (!data.success && data.needs_push_subscription) {
        channelsStatus.textContent = `⚠️ ${t('err_push_first')}`;
      } else if (!data.success) {
        channelsStatus.textContent = `⚠️ ${data.error || 'Error'}`;
      } else {
        channelsStatus.textContent = t('channels_saved');
      }
    } catch (err) {
      channelsStatus.textContent = `⚠️ ${err.message}`;
    } finally {
      saveChannelsBtn.disabled = false;
      saveChannelsBtn.textContent = t('save_channels');
    }
  });

  // --- "Mis rutas guardadas" ---
  const myRoutesBtn = document.getElementById('my-routes-btn');
  const myRoutesBox = document.getElementById('my-routes-box');
  // Gráfica simple (SVG) del historial de precio de una ruta — para que
  // se vea de un vistazo si ha subido, bajado, o se ha mantenido plano.
  function renderPriceSparkline(history) {
    if (!history || history.length < 2) return ''; // no hay suficientes puntos para una línea

    const prices = history.map((h) => h.price);
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    const range = max - min || 1; // evita dividir entre 0 si todos son iguales
    const width = 280;
    const height = 50;
    const padding = 4;

    const points = history.map((h, i) => {
      const x = (i / (history.length - 1)) * (width - padding * 2) + padding;
      const y = height - padding - ((h.price - min) / range) * (height - padding * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });

    // Verde si el último precio es igual o menor al primero, rojo si subió.
    const trendColor = prices[prices.length - 1] <= prices[0] ? '#2F7D5C' : '#8C2F39';

    return `
      <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:44px; margin-top:4px;" preserveAspectRatio="none">
        <polyline points="${points.join(' ')}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="calendar-status" style="padding:0; font-size:10px; display:flex; justify-content:space-between;">
        <span>$${min.toFixed(0)}</span>
        <span>$${max.toFixed(0)}</span>
      </div>`;
  }

  myRoutesBtn.addEventListener('click', async () => {
    clearError();
    const email = getUserEmail();
    if (!email) { showError('Escribe un correo válido arriba primero.'); return; }
    const sessionToken = getValidSessionToken();
    if (!sessionToken) { promptVerification('Verifica tu correo antes de ver tus rutas guardadas.', () => myRoutesBtn.click()); return; }

    myRoutesBtn.disabled = true;
    myRoutesBox.classList.add('open');
    myRoutesBox.innerHTML = '<div class="calendar-status">Consultando tus rutas...</div>';

    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=list&email=${encodeURIComponent(email)}&session_token=${encodeURIComponent(sessionToken)}`);
      const data = await resp.json();

      if (!data.success && data.needs_verification) {
        myRoutesBox.classList.remove('open');
        promptVerification('Tu sesión expiró. Verifica tu correo de nuevo.', () => myRoutesBtn.click());
        return;
      }

      const routes = data.routes || [];

      if (routes.length === 0) {
        myRoutesBox.innerHTML = '<div class="calendar-status">No tienes rutas guardadas todavía.</div>';
        return;
      }

      let html = '<div class="price-calendar-title">Tus rutas</div>';
      for (const r of routes) {
        const tripLabel = r.return_date ? `${r.depart_date} → ${r.return_date}` : `${r.depart_date} (solo ida)`;
        const paxLabel = r.passengers === 1 ? '1 pasajero' : `${r.passengers} pasajeros`;
        const airlineLabel = r.preferred_airline ? ` · ${r.preferred_airline}` : '';
        let priceLabel = 'Sin precio aún';
        if (r.current_price) {
          const checkedDate = r.last_checked_at ? new Date(r.last_checked_at).toLocaleDateString('es') : '';
          priceLabel = `Precio actual (${checkedDate}): $${Math.round(r.current_price)}`;
          if (r.lowest_price && Math.round(r.lowest_price) !== Math.round(r.current_price)) {
            priceLabel += ` · Mínimo visto: $${Math.round(r.lowest_price)}`;
          }
        }
        const routeLink = buildAffiliateLink(r.origin, r.destination, r.depart_date, r.return_date, r.passengers);
        const sparkline = renderPriceSparkline(r.price_history);
        html += `
          <div class="price-row">
            <div class="price-row-header">
              <span>${r.origin} → ${r.destination}, ${tripLabel} (${paxLabel}${airlineLabel})</span>
            </div>
            <div class="calendar-status" style="padding:0;">${priceLabel}</div>
            ${sparkline}
            ${routeLink ? `<a class="book-link" href="${routeLink}" target="_blank" rel="noopener">Reservar →</a>` : ''}
            <button type="button" class="channel-option" data-remove-id="${r.id}" style="margin-top:6px; width:100%;">🗑️ Eliminar</button>
          </div>`;
      }
      myRoutesBox.innerHTML = html;

      myRoutesBox.querySelectorAll('[data-remove-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const routeId = btn.dataset.removeId;
          btn.disabled = true;
          btn.textContent = 'Eliminando...';
          try {
            await fetch(`${CALENDAR_PROXY_URL}?action=remove`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, route_id: routeId, session_token: sessionToken }),
            });
            myRoutesBtn.click(); // recargamos la lista
          } catch (err) {
            showError('No se pudo eliminar: ' + err.message);
          }
        });
      });
    } catch (err) {
      myRoutesBox.innerHTML = `<div class="calendar-status">⚠️ Error de conexión: ${err.message}</div>`;
    } finally {
      myRoutesBtn.disabled = false;
    }
  });


  // Ya no usamos tg.MainButton/tg.sendData — el botón propio
  // "🔍 Buscar el vuelo más barato" (más arriba) llama directo al
  // Worker vía fetch, así que funciona igual dentro o fuera de Telegram.
</script>
