<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis rutas — Trackear Vuelos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1D4ED8">
<style>
  :root {
    color-scheme: light;
    --brand-blue: #1D4ED8;
    --brand-wine: #8C2F39;
    --ink: #16223A;
    --ink-soft: #5B6B85;
    --ink-faint: #6B7A94;
    --field-bg: #F4F8FF;
    --dash: #D7E2F7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #F1F6FF 0%, #FFFFFF 420px);
    color: var(--ink);
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  a.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--brand-blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 24px;
    margin: 0 0 6px 0;
  }
  p.subtitle {
    margin: 0 0 22px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  #lang-switch-btn {
    float: right;
    background: var(--field-bg);
    border: 1px solid var(--dash);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-blue);
    cursor: pointer;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink-faint);
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--dash);
    background: var(--field-bg);
    color: var(--ink);
    font-size: 16px;
  }
  input:focus { outline: 2px solid var(--brand-blue); outline-offset: -1px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .checkbox-row input { width: 18px; height: 18px; }
  .checkbox-row label { margin: 0; font-size: 14px; font-weight: 400; color: var(--ink); }
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--dash);
    background: var(--field-bg);
    color: var(--brand-blue);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--brand-blue); color: #fff; border-color: transparent; }
  .status { font-size: 13px; color: var(--ink-soft); min-height: 18px; margin-bottom: 8px; }
  .card {
    background: #fff;
    border: 1px solid var(--dash);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .price-row {
    background: var(--field-bg);
    border: 1px solid var(--dash);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .price-row-header {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .row-book-link {
    display: block;
    margin-top: 6px;
    padding: 9px 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
  }
  .row-btn-book { background: var(--brand-wine); }
  .row-btn-expedia { background: #00355F; }
  .row-btn-kayak { background: #FF690E; }
  .remove-btn {
    margin-top: 6px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--dash);
    background: #fff;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

  <button type="button" id="lang-switch-btn">🌐 EN</button>
  <a class="back-link" href="index.html" data-i18n="back"></a>

  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <div class="card">
    <div class="field">
      <label for="user-email" data-i18n="email_label"></label>
      <input type="email" id="user-email" placeholder="tu@correo.com">
      <div class="checkbox-row" style="margin-top:6px; margin-bottom:0;">
        <input type="checkbox" id="remember-email-checkbox">
        <label for="remember-email-checkbox" data-i18n="remember_email"></label>
      </div>
    </div>

    <div class="field" id="verification-box" style="display:none;">
      <div class="status" id="verification-status"></div>
      <button type="button" class="btn" id="request-code-btn" data-i18n="resend_code"></button>
      <div id="code-entry-row" style="display:none; margin-top:8px;">
        <input type="text" id="verify-code-input" data-i18n-ph="code_ph" maxlength="6" inputmode="numeric" style="margin-bottom:8px;">
        <button type="button" class="btn" id="confirm-code-btn" data-i18n="confirm_code"></button>
      </div>
    </div>

    <button type="button" class="btn" id="send-code-btn" data-i18n="send_code"></button>
  </div>

  <div class="card" id="routes-box" style="display:none;">
    <label data-i18n="routes_label"></label>
    <div id="routes-list"></div>
  </div>

<script>
  const TRANSLATIONS = {
    es: {
      back: '← Volver al buscador',
      title: '📋 Mis rutas',
      subtitle: 'Verifica tu correo para ver y administrar las rutas que estás siguiendo.',
      email_label: 'Tu correo',
      remember_email: 'Recordar mi correo en este dispositivo',
      send_code: '📧 Mandarme un código de verificación',
      resend_code: '📧 Reenviar código',
      code_ph: 'Código de 6 dígitos',
      confirm_code: '✅ Confirmar código',
      sending_code: 'Enviando código...',
      code_sent: 'Te enviamos un código de verificación (revisa spam también):',
      verified: '✅ Correo verificado.',
      err_email: 'Escribe un correo válido arriba primero.',
      routes_label: 'Tus rutas guardadas',
      loading_routes: 'Consultando tus rutas...',
      no_routes: 'No tienes rutas guardadas todavía.',
      one_way_label: '(solo ida)',
      one_passenger: '1 pasajero',
      passengers_label: '{n} pasajeros',
      not_checked_yet: 'Todavía no hemos consultado esta ruta',
      last_checked: 'Última consulta: {date} · precio disponible en Aviasales, Expedia o KAYAK',
      view_on: '✈️ Ver en {name}',
      remove: '🗑️ Eliminar',
      removing: 'Eliminando...',
      remove_error: 'No se pudo eliminar: {err}',
      conn_error: '⚠️ Error de conexión: {err}',
      session_expired: 'Tu sesión expiró. Verifica tu correo de nuevo.',
    },
    en: {
      back: '← Back to search',
      title: '📋 My routes',
      subtitle: 'Verify your email to see and manage the routes you\'re tracking.',
      email_label: 'Your email',
      remember_email: 'Remember my email on this device',
      send_code: '📧 Send me a verification code',
      resend_code: '📧 Resend code',
      code_ph: '6-digit code',
      confirm_code: '✅ Confirm code',
      sending_code: 'Sending code...',
      code_sent: "We sent you a verification code (check spam too):",
      verified: '✅ Email verified.',
      err_email: 'Enter a valid email above first.',
      routes_label: 'Your saved routes',
      loading_routes: 'Checking your routes...',
      no_routes: "You don't have any saved routes yet.",
      one_way_label: '(one way)',
      one_passenger: '1 passenger',
      passengers_label: '{n} passengers',
      not_checked_yet: "We haven't checked this route yet",
      last_checked: 'Last checked: {date} · price available on Aviasales, Expedia or KAYAK',
      view_on: '✈️ View on {name}',
      remove: '🗑️ Remove',
      removing: 'Removing...',
      remove_error: 'Could not remove: {err}',
      conn_error: '⚠️ Connection error: {err}',
      session_expired: 'Your session expired. Verify your email again.',
    },
  };

  let currentLang = localStorage.getItem('flightbot_lang') || 'es';
  function t(key, params) {
    let str = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.es[key] || key;
    if (params) {
      for (const k in params) str = str.replace(`{${k}}`, params[k]);
    }
    return str;
  }
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.getElementById('lang-switch-btn').textContent = currentLang === 'es' ? '🌐 EN' : '🌐 ES';
  }
  document.getElementById('lang-switch-btn').addEventListener('click', () => {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    localStorage.setItem('flightbot_lang', currentLang);
    applyTranslations();
  });
  applyTranslations();

  const CALENDAR_PROXY_URL = "https://flightsprices.duardipr.workers.dev";

  function getUserEmail() {
    const input = document.getElementById('user-email');
    const email = input.value.trim();
    return email.includes('@') && email.includes('.') ? email : null;
  }

  let inMemorySession = null;

  function saveSession(email, sessionToken) {
    inMemorySession = { email, session_token: sessionToken };
    const rememberCheckbox = document.getElementById('remember-email-checkbox');
    if (rememberCheckbox && rememberCheckbox.checked) {
      localStorage.setItem('flightbot_session', JSON.stringify(inMemorySession));
    }
  }

  function getValidSessionToken() {
    if (inMemorySession && inMemorySession.email === getUserEmail()) return inMemorySession.session_token;
    try {
      const saved = JSON.parse(localStorage.getItem('flightbot_session') || 'null');
      if (saved && saved.email === getUserEmail() && saved.session_token) return saved.session_token;
    } catch {}
    return null;
  }

  // Si al abrir la página ya hay un correo guardado de una visita
  // anterior, lo precargamos para no pedirlo de nuevo.
  (function preloadSavedEmail() {
    try {
      const saved = JSON.parse(localStorage.getItem('flightbot_session') || 'null');
      if (saved && saved.email) document.getElementById('user-email').value = saved.email;
    } catch {}
  })();

  const verificationBox = document.getElementById('verification-box');
  const verificationStatus = document.getElementById('verification-status');
  const codeEntryRow = document.getElementById('code-entry-row');
  const requestCodeBtn = document.getElementById('request-code-btn');
  const confirmCodeBtn = document.getElementById('confirm-code-btn');
  const sendCodeBtn = document.getElementById('send-code-btn');

  async function sendVerificationCode(email) {
    verificationStatus.textContent = t('sending_code');
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=request_verification`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, language: currentLang }),
      });
      const data = await resp.json();
      if (data.success) {
        verificationStatus.textContent = t('code_sent');
        codeEntryRow.style.display = 'block';
      } else {
        verificationStatus.textContent = `⚠️ ${data.error || 'Error'}`;
      }
    } catch (err) {
      verificationStatus.textContent = `⚠️ ${err.message}`;
    }
  }

  sendCodeBtn.addEventListener('click', () => {
    const email = getUserEmail();
    if (!email) { alert(t('err_email')); return; }
    verificationBox.style.display = 'block';
    sendVerificationCode(email);
  });
  requestCodeBtn.addEventListener('click', () => {
    const email = getUserEmail();
    if (email) sendVerificationCode(email);
  });

  confirmCodeBtn.addEventListener('click', async () => {
    const email = getUserEmail();
    const code = document.getElementById('verify-code-input').value.trim();
    if (!email || !code) return;
    confirmCodeBtn.disabled = true;
    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=confirm_email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code }),
      });
      const data = await resp.json();
      if (data.success) {
        saveSession(email, data.session_token);
        verificationStatus.textContent = t('verified');
        codeEntryRow.style.display = 'none';
        loadRoutes();
      } else {
        verificationStatus.textContent = `⚠️ ${data.error || 'Error'}`;
      }
    } catch (err) {
      verificationStatus.textContent = `⚠️ ${err.message}`;
    } finally {
      confirmCodeBtn.disabled = false;
    }
  });

  // --- Construcción de links de reserva (Aviasales, Expedia, KAYAK) ---
  // Los mismos 3 proveedores que en el buscador principal — el script
  // de Stay22 (LMA) ya instalado en index.html se encarga de monetizar
  // Expedia y KAYAK automáticamente, sin necesitar cuenta propia.
  function buildAffiliateLink(origin, destination, departDate, returnDate, passengers) {
    try {
      const [, dm, dd] = departDate.split('-');
      const departDDMM = `${dd}${dm}`;
      let returnDDMM = '';
      if (returnDate) {
        const [, rm, rd] = returnDate.split('-');
        returnDDMM = `${rd}${rm}`;
      }
      const pax = passengers && passengers > 0 ? passengers : 1;
      const path = `${origin.toUpperCase()}${departDDMM}${destination.toUpperCase()}${returnDDMM}${pax}`;
      return `https://www.aviasales.com/search/${path}?marker=770071`;
    } catch (e) {
      return null;
    }
  }

  function buildExpediaLink(origin, destination, departDate, returnDate, passengers) {
    try {
      const toExpediaDate = (isoDate) => {
        const [y, m, d] = isoDate.split('-');
        return `${m}/${d}/${y}`;
      };
      const params = new URLSearchParams();
      if (returnDate) {
        params.set('trip', 'roundtrip');
        params.set('leg1', `from:${origin},to:${destination},departure:${toExpediaDate(departDate)}`);
        params.set('leg2', `from:${destination},to:${origin},departure:${toExpediaDate(returnDate)}`);
      } else {
        params.set('trip', 'oneway');
        params.set('leg1', `from:${origin},to:${destination},departure:${toExpediaDate(departDate)}`);
      }
      params.set('passengers', `adults:${passengers && passengers > 0 ? passengers : 1}`);
      params.set('mode', 'search');
      return `https://www.expedia.com/Flights-Search?${params.toString()}`;
    } catch (e) {
      return null;
    }
  }

  function buildKayakLink(origin, destination, departDate, returnDate) {
    try {
      return returnDate
        ? `https://www.kayak.com/flights/${origin}-${destination}/${departDate}/${returnDate}?sort=bestflight_a`
        : `https://www.kayak.com/flights/${origin}-${destination}/${departDate}?sort=bestflight_a`;
    } catch (e) {
      return null;
    }
  }

  function buildProviderLinks(origin, destination, departDate, returnDate, passengers, providerPreference) {
    const selected = (providerPreference || 'aviasales,expedia,kayak').split(',').map((p) => p.trim());
    const links = [];
    if (selected.includes('aviasales')) {
      const url = buildAffiliateLink(origin, destination, departDate, returnDate, passengers);
      if (url) links.push({ name: 'Aviasales', url, cssClass: 'row-btn-book' });
    }
    if (selected.includes('expedia')) {
      const url = buildExpediaLink(origin, destination, departDate, returnDate, passengers);
      if (url) links.push({ name: 'Expedia', url, cssClass: 'row-btn-expedia' });
    }
    if (selected.includes('kayak')) {
      const url = buildKayakLink(origin, destination, departDate, returnDate);
      if (url) links.push({ name: 'KAYAK', url, cssClass: 'row-btn-kayak' });
    }
    return links;
  }

  const routesBox = document.getElementById('routes-box');
  const routesList = document.getElementById('routes-list');

  async function loadRoutes() {
    const email = getUserEmail();
    const sessionToken = getValidSessionToken();
    if (!email || !sessionToken) return;

    routesBox.style.display = 'block';
    routesList.innerHTML = `<div class="status">${t('loading_routes')}</div>`;

    try {
      const resp = await fetch(`${CALENDAR_PROXY_URL}?action=list&email=${encodeURIComponent(email)}&session_token=${encodeURIComponent(sessionToken)}`);
      const data = await resp.json();

      if (!data.success && data.needs_verification) {
        routesList.innerHTML = `<div class="status">⚠️ ${t('session_expired')}</div>`;
        return;
      }

      const routes = data.routes || [];
      if (routes.length === 0) {
        routesList.innerHTML = `<div class="status">${t('no_routes')}</div>`;
        return;
      }

      routesList.innerHTML = routes.map((r) => {
        const tripLabel = r.return_date ? `${r.depart_date} → ${r.return_date}` : `${r.depart_date} ${t('one_way_label')}`;
        const paxLabel = r.passengers === 1 ? t('one_passenger') : t('passengers_label', { n: r.passengers });
        const airlineLabel = r.preferred_airline ? ` · ${r.preferred_airline}` : '';
        let checkedLabel = t('not_checked_yet');
        if (r.last_checked_at) {
          const checkedDate = new Date(r.last_checked_at).toLocaleDateString(currentLang === 'en' ? 'en' : 'es');
          checkedLabel = t('last_checked', { date: checkedDate });
        }
        const providerLinks = buildProviderLinks(r.origin, r.destination, r.depart_date, r.return_date, r.passengers, r.provider_preference);
        const providerLinksHtml = providerLinks.map((p) => `<a class="row-book-link ${p.cssClass}" href="${p.url}" target="_blank" rel="noopener">${t('view_on', { name: p.name })}</a>`).join('');
        return `
          <div class="price-row">
            <div class="price-row-header">${r.origin} → ${r.destination}, ${tripLabel} (${paxLabel}${airlineLabel})</div>
            <div class="status" style="margin:0;">${checkedLabel}</div>
            ${providerLinksHtml}
            <button type="button" class="remove-btn" data-remove-id="${r.id}">${t('remove')}</button>
          </div>`;
      }).join('');

      routesList.querySelectorAll('[data-remove-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const routeId = btn.dataset.removeId;
          btn.disabled = true;
          btn.textContent = t('removing');
          try {
            await fetch(`${CALENDAR_PROXY_URL}?action=remove`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, route_id: routeId, session_token: sessionToken }),
            });
            loadRoutes(); // recargamos la lista
          } catch (err) {
            alert(t('remove_error', { err: err.message }));
          }
        });
      });
    } catch (err) {
      routesList.innerHTML = `<div class="status">${t('conn_error', { err: err.message })}</div>`;
    }
  }

  window.addEventListener('load', () => {
    if (getValidSessionToken()) {
      verificationStatus.textContent = t('verified');
      verificationBox.style.display = 'block';
      loadRoutes();
    }
  });
</script>

</body>
</html>
